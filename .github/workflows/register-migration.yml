
name: Register Expense Ownership Migration

on:
  push:
    branches:
      - feature/expense-ownership-and-sliding-sessions
    paths:
      - ".github/workflows/register-migration.yml"

jobs:
  register:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register manually applied migration
        run: >
          npx prisma migrate resolve
          --applied 20261117000000_add_expense_ownership

      - name: Verify migration status
        run: npx prisma migrate status

